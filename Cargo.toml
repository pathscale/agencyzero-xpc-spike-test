[workspace]
resolver = "3"
members = ["crates/agencyzero", "crates/agentone"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
rama-net-apple-xpc = "0.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
